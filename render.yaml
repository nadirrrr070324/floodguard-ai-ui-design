services:
  - type: web
    name: floodguard-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: node backend/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
    healthCheckPath: /api/health
    autoDeploy: true
